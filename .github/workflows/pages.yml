name: Publicar

# Publica a raiz do repositório no GitHub Pages a cada push na main. O produto
# é estático e não tem etapa de build: o que está versionado é o que é servido.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` liga o GitHub Pages na primeira execução, sem precisar
      # mexer nas configurações do repositório à mão.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: publicacao
        uses: actions/deploy-pages@v4
